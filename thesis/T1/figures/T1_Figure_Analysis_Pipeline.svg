<svg width="1020" height="860" viewBox="0 0 1020 860" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Three capture streams feed the comparison. Control runs build the noise model; pre-change and post-change runs build the two profiles. One chi-square gate asks whether the profile changed at all, then each event key is tested against the measured noise, corrected for multiple comparisons, classified, paired for field-level loss, and traversed to the detection rules it affects." class="dg"><rect x="0" y="0" width="1020" height="860" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6E86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E79"/></marker></defs><text x="180.0" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">CONTROL  ·  5 RUNS</text><rect x="30.0" y="38" width="300.0" height="58" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="180.0" y="58.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Same snapshot, same stimulus,</text><text x="180.0" y="75.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">no configuration change</text><path d="M180.0 96.0 V128.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><text x="510.0" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">PRE-CHANGE  ·  3 RUNS</text><rect x="360.0" y="38" width="300.0" height="58" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="510.0" y="58.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Same snapshot, same stimulus,</text><text x="510.0" y="75.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">before the change</text><path d="M510.0 96.0 V128.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><text x="840.0" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">POST-CHANGE  ·  3 RUNS</text><rect x="690.0" y="38" width="300.0" height="58" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="840.0" y="58.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Same snapshot, same stimulus,</text><text x="840.0" y="75.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">after the change</text><path d="M840.0 96.0 V128.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="30" y="130" width="960" height="56" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="510.0" y="158.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Reduce every raw record to an event key    e = ( source, event ID, populated tracked fields )</text><path d="M180.0 186.0 V218.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M510.0 186.0 V218.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M840.0 186.0 V218.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="30" y="220" width="300.0" height="62" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="31.5" y="228" width="4.5" height="46" rx="2.2" fill="#1D4E79"/><text x="183.0" y="242.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Dispersion φ(e) and coefficient</text><text x="183.0" y="259.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">of variation per key, the noise floor</text><rect x="360" y="220" width="300.0" height="62" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="510.0" y="242.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Pre-change rate</text><text x="510.0" y="259.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">λ₀(e)  =  count / runs</text><rect x="690" y="220" width="300.0" height="62" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="840.0" y="242.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Post-change rate</text><text x="840.0" y="259.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">λ₁(e)  =  count / runs</text><path d="M510.0 282.0 V320.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M840.0 282.0 V301.0 H630.0 V320.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="230" y="322" width="560" height="62" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="231.5" y="330" width="4.5" height="46" rx="2.2" fill="#1D4E79"/><text x="513.0" y="344.25" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Global gate:  one χ² test of homogeneity on the whole 2 × K profile</text><text x="513.0" y="361.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">did the emitted profile change at all?    no  →  archive, test no keys</text><path d="M510.0 384.0 V412.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M180.0 282.0 V403.0 H390.0 V412.0" fill="none" stroke="#1D4E79" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ard)"/><rect x="181" y="294" width="56.9" height="16" rx="3" fill="#FFFFFF"/><text x="188" y="302" font-size="10.5" font-weight="600" text-anchor="start" fill="#3E4E63" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">noise floor</text><rect x="30" y="414" width="960" height="74" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="510.0" y="442.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">For every key in the union of both profiles:    rate ratio  RR(e) = λ₁(e) / λ₀(e)  with a confidence interval,</text><text x="510.0" y="459.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">and  p(e)  from a rate test that uses the measured dispersion φ(e) instead of assuming none</text><path d="M510.0 488.0 V516.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="230" y="518" width="560" height="50" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="510.0" y="543.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Benjamini-Hochberg across all K keys  →  q(e), the false-discovery-corrected value</text><path d="M510.0 568.0 V596.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="140" y="598" width="740" height="80" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="141.5" y="606" width="4.5" height="64" rx="2.2" fill="#1D4E79"/><text x="513.0" y="620.5" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Decision rule  →  LOST  ·  REDUCED  ·  UNCHANGED  ·  NEW  ·  INCONCLUSIVE</text><text x="513.0" y="638.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">a key is only a finding if it clears q, effect size, and the noise floor together</text><text x="513.0" y="655.5" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">fewer than 30 events before the change  →  INCONCLUSIVE, never tested</text><path d="M510.0 678.0 V706.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="140" y="708" width="740" height="50" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="141.5" y="716" width="4.5" height="34" rx="2.2" fill="#1D4E79"/><text x="513.0" y="733.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Pair LOST and NEW keys of one event type differing only by dropped fields  →  field-level loss</text><path d="M510.0 758.0 V786.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="140" y="788" width="740" height="50" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="510.0" y="813.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Graph traversal  e → detection rules → ATT&amp;CK techniques  →  impact score  →  ranked report</text></svg>
