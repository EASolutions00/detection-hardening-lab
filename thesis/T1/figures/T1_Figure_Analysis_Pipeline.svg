<?xml version="1.0" encoding="UTF-8"?>
<svg width="1020" height="1174" viewBox="0 0 1020 1174" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="The analysis in the five steps of the proposal. The run records of 5 control runs, 3 runs before and 3 after the change are imported and checked, and each event becomes an event key. Myers' difference algorithm compares the before list with the after list and lists every deleted and inserted event. Every key is then tested against the noise measured in the control runs, corrected for multiple comparisons, classified, and paired for field-level loss. Lost and reduced keys are linked to the detection rules and ATT&amp;CK techniques that read them, ranked by three measured numbers, and written to the report with recommendations." class="dg"><rect x="0" y="0" width="1020" height="1174" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6E86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E79"/></marker></defs><text x="180.0" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">CONTROL  ·  5 RUNS</text><rect x="30.0" y="38" width="300.0" height="58" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="180.0" y="58.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Same snapshot, same attack tests,</text><text x="180.0" y="75.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">no configuration change</text><text x="510.0" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">BEFORE THE CHANGE  ·  3 RUNS</text><rect x="360.0" y="38" width="300.0" height="58" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="510.0" y="58.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Same snapshot, same attack tests,</text><text x="510.0" y="75.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">before the change</text><text x="840.0" y="22" font-size="11" font-weight="600" text-anchor="middle" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">AFTER THE CHANGE  ·  3 RUNS</text><rect x="690.0" y="38" width="300.0" height="58" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="840.0" y="58.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Same snapshot, same attack tests,</text><text x="840.0" y="75.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">change applied by script</text><path d="M180.0 96 V144.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M510.0 96 V144.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M840.0 96 V144.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><text x="196.0" y="134.0" font-size="11" font-weight="600" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">STEP 1  ·  IMPORT</text><rect x="30" y="146" width="960" height="58" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="31.5" y="154" width="4.5" height="42" rx="2.2" fill="#1D4E79"/><text x="513.0" y="166.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Read the run records and the rule files exported from the SIEM; leave out the voided runs and name them</text><text x="513.0" y="183.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">at least 3 valid runs per phase; one settings hash (SHA-256) and one change for all runs; the rule files' hash</text><path d="M180.0 204 V252.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M510.0 204 V252.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M840.0 204 V252.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><text x="196.0" y="242.0" font-size="11" font-weight="600" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">STEP 2  ·  NORMALIZE</text><rect x="30" y="254" width="960" height="58" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="31.5" y="262" width="4.5" height="42" rx="2.2" fill="#1D4E79"/><text x="513.0" y="274.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Each event becomes an event key    e = ( source, event ID, populated tracked fields, value class of a few )</text><text x="513.0" y="291.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">each phase's runs joined into one list, sorted by merge sort; a hash map counts the events of each key</text><path d="M180.0 312 V360.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M510.0 312 V360.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><path d="M840.0 312 V360.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><text x="196.0" y="350.0" font-size="11" font-weight="600" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">FOR STEP 4</text><text x="522.0" y="350.0" font-size="11" font-weight="600" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">STEP 3  ·  COMPARE</text><rect x="30" y="362" width="300.0" height="80" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="31.5" y="370" width="4.5" height="64" rx="2.2" fill="#1D4E79"/><text x="183.0" y="375.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Noise model from the 5 control runs:</text><text x="183.0" y="393.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">dispersion φ(e) and the coefficient</text><text x="183.0" y="410.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">of variation CoV(e) of every key</text><text x="183.0" y="428.25" font-size="11" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">a control run with no events: stop, with an error</text><rect x="360" y="362" width="630" height="80" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="361.5" y="370" width="4.5" height="64" rx="2.2" fill="#1D4E79"/><text x="678.0" y="384.5" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Myers' difference algorithm: the before list against the after list</text><text x="678.0" y="402.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">→  deleted events (losses), inserted events (new), edit distance D</text><text x="678.0" y="419.5" font-size="11" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">normal noise is included, so it decides no key: step 4 tests every key</text><path d="M675.0 442 V490.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><text x="230" y="480.0" font-size="11" font-weight="600" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">STEP 4  ·  CHECK AGAINST NORMAL VARIATION</text><rect x="230" y="492" width="560" height="58" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="231.5" y="500" width="4.5" height="42" rx="2.2" fill="#1D4E79"/><text x="513.0" y="512.25" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Capture check: a run before or after with no events  →  NOT TESTABLE, stop</text><text x="513.0" y="529.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Whole-profile χ²: one test on the 2 × K profile, reported as a summary only</text><path d="M510.0 550 V576.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="30" y="578" width="960" height="74" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="31.5" y="586" width="4.5" height="58" rx="2.2" fill="#1D4E79"/><text x="513.0" y="606.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">For every key, rates  λ₀(e), λ₁(e) = count / runs.    Fell to 0: the exact test,  p = exp( −λ₀ · n₂ / φ(e) ),  n₂ runs after</text><text x="513.0" y="623.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Dropped: the rate ratio  RR(e) = λ₁ / λ₀,  with p from a rate test that uses the measured dispersion φ(e)</text><path d="M180.0 442 V576.0" fill="none" stroke="#1D4E79" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ard)"/><rect x="181" y="556" width="56.9" height="16" rx="3" fill="#FFFFFF"/><text x="188" y="564" font-size="10.5" font-weight="600" text-anchor="start" fill="#3E4E63" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">noise floor</text><path d="M510.0 652 V678.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="230" y="680" width="560" height="50" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="231.5" y="688" width="4.5" height="34" rx="2.2" fill="#1D4E79"/><text x="513.0" y="705.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Benjamini-Hochberg across all K keys  →  q(e), the false-discovery-corrected value</text><path d="M510.0 730 V756.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="140" y="758" width="740" height="98" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="141.5" y="766" width="4.5" height="82" rx="2.2" fill="#1D4E79"/><text x="513.0" y="780.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Decision rule  →  LOST  ·  REDUCED  ·  UNCHANGED  ·  NEW  ·  INCONCLUSIVE</text><text x="513.0" y="798.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">LOST: none after and q ≤ α, at any count    ·    none after but q &gt; α  →  INCONCLUSIVE</text><text x="513.0" y="815.75" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">REDUCED needs all three: q ≤ α, ratio ≤ 0.5, drop &gt; 3 × CoV    ·    0 before  →  NEW</text><text x="513.0" y="833.25" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">a partial drop with fewer than 30 before, or a key the control runs never saw  →  INCONCLUSIVE</text><path d="M510.0 856 V882.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="140" y="884" width="740" height="50" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="141.5" y="892" width="4.5" height="34" rx="2.2" fill="#1D4E79"/><text x="513.0" y="909.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Pair LOST and NEW keys of one event type differing only by dropped fields  →  field-level loss</text><path d="M510.0 934 V982.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><text x="140" y="972.0" font-size="11" font-weight="600" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">STEP 5  ·  LINK TO DETECTIONS</text><rect x="140" y="984" width="740" height="76" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="141.5" y="992" width="4.5" height="60" rx="2.2" fill="#1D4E79"/><text x="513.0" y="1004.5" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Event key  →  the rules that read it  →  their ATT&amp;CK techniques;  the techniques no longer detected</text><text x="513.0" y="1022.0" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Rank by three measured numbers, not a score: blind techniques, highest level, number of rules</text><text x="513.0" y="1039.5" font-size="13" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Recommend: rules that still read events seen after the change, and known compensating controls</text><path d="M510.0 1060 V1086.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><rect x="140" y="1088" width="740" height="56" rx="3" fill="#F2F7FC" stroke="#1D4E79" stroke-width="1.6"/><rect x="140" y="1088" width="5" height="56" fill="#1D4E79"/><text x="512.0" y="1107.25" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">« artifact »  Report: the verdict with the undecided keys, Myers, the noise floor, the ranked findings,</text><text x="512.0" y="1124.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">the coverage change, the recommendations, the reproducibility record   ·   CSV  ·  JSON  ·  ATT&amp;CK Navigator layer</text></svg>
