napshot, tests, window, rule set, thresholds</text><rect x="317.0" y="1016" width="406.0" height="60" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="318.5" y="1024" width="4.5" height="44" rx="2.2" fill="#1D4E79"/><text x="523.0" y="1037.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Restore the configuration snapshot and settle;</text><text x="523.0" y="1054.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">open the window, run the adversary simulation suite</text><rect x="972.0" y="1106" width="256.0" height="60" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="1100.0" y="1127.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Endpoints emit pre-change</text><text x="1100.0" y="1144.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">events; the SIEM archives them</text><rect x="317.0" y="1196" width="406.0" height="60" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="318.5" y="1204" width="4.5" height="44" rx="2.2" fill="#1D4E79"/><text x="523.0" y="1217.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Export the archived events; build the pre-change</text><text x="523.0" y="1234.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">profile keyed by event type + populated tracked fields</text><rect x="