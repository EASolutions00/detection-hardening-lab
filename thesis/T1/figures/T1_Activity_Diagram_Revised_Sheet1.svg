" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Import detection rules; build the</text><text x="558.0" y="344.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">event key → rule → ATT&amp;CK index</text><rect x="352" y="396" width="406" height="60" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="353.5" y="404" width="4.5" height="44" rx="2.2" fill="#1D4E79"/><text x="558.0" y="417.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Run 5 control captures:</text><text x="558.0" y="434.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">same stimulus, no change applied</text><rect x="802" y="486" width="276" height="60" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="803.5" y="494" width="4.5" height="44" rx="2.2" fill="#1D4E79"/><text x="943.0" y="507.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Restore snapshot, run the stimulus,</text><text x="943.0" y="524.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">forward events to the SIEM</text><rect x="352" y="576" width="406" height="60" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="353.5" y="584" width="4.5" height="44" rx="2.2" fill="#1D4E79"/><text x="558.0" y="597.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Fit the noise model per event key:</text><text x="558.0" y="614.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">mean rate, variability, dispersion</text><rect x="352" y="666" width="406" height="62" rx="3" fill="#F2F7FC" stroke="#1D4E79" stroke-width="1.6"/><rect x="352" y="666" width="5" height="62" fill="#1D4E79"/><text x="557.0" y="688.25" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">« datastore »  Noise baseline</text><text x="557.0" y="705.75" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">+ dependency index          →  A</text><rect x="22" y="828" width="286" height="60" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="165.0" y="849.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Define the hardening change and scope:</text><text x="165.0" y="866.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">CIS / STIG ID, hosts, atomic test IDs</text><rect x="352" y="918" width="406" height="60" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="353.5" y="926" width="4.5" height="44" rx="2.2" fill="#1D4E79"/><text x="558.0" y="939.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Freeze and hash the run manifest: snapshot,</text><text x="558.0" y="956.75" font-size="13.5" font-weight="400" text-anchor="middle" f