t-change profile</text><rect x="317.0" y="2016" width="406.0" height="50" rx="3" fill="#F2F7FC" stroke="#1D4E79" stroke-width="1.6"/><rect x="317.0" y="2016" width="5" height="50" fill="#1D4E79"/><text x="522.0" y="2041.0" font-size="12.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">« datastore »  Post-change profile (3 runs)</text><circle cx="520.0" cy="2106" r="17" fill="#FFFFFF" stroke="#1D4E79" stroke-width="1.8"/><text x="520.0" y="2106" font-size="14" font-weight="700" text-anchor="middle" fill="#1D4E79" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">C</text></svg>
