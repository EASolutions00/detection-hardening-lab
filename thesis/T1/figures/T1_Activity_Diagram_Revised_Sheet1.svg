nant-baseline="middle">Import detection rules; build the</text><text x="523.0" y="304.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">event key → rule → ATT&amp;CK index</text><rect x="317.0" y="372" width="406.0" height="60" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="318.5" y="380" width="4.5" height="44" rx="2.2" fill="#1D4E79"/><text x="523.0" y="393.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Control capture, no change applied: restore</text><text x="523.0" y="410.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">and settle, open the window, run the stimulus</text><rect x="972.0" y="462" width="256.0" height="60" rx="7" fill="#FFFFFF" stroke="#7E93AC" stroke-width="1.5"/><text x="1100.0" y="483.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Endpoints emit events;</text><text x="1100.0" y="500.75" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">the SIEM archives every one</text><rect x="317.0" y="568" width="406.0" height="60" rx="7" fill="#EAF2F9" stroke="#7E93AC" stroke-width="1.5"/><rect x="318.5" y="576" width="4.5" height="44" rx="2.2" fill="#1D4E79"/><text x="523.0" y="589.25" font-size="13.5" font-weight="400" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">Fit the noise model per event key:</text><text x="523.0" y="606.75" font-size="13.5" font-weight=