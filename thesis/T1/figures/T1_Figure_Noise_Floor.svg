<?xml version="1.0" encoding="UTF-8"?>
<svg width="1060" height="400" viewBox="0 0 1060 400" role="img" xmlns="http://www.w3.org/2000/svg" aria-label="Three event keys compared against their measured noise band. One drop falls inside the band and is not a finding. One is zero after the change and is reported LOST. One had only 12 events before the change, below the minimum of 30, so it is never tested and is reported INCONCLUSIVE." class="dg"><rect x="0" y="0" width="1060" height="400" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5A6E86"/></marker><marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4E79"/></marker></defs><text x="380.0" y="34" font-size="11" font-weight="600" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">OBSERVED RATE AFTER THE CHANGE, AS A SHARE OF THE RATE BEFORE</text><text x="380.0" y="58" font-size="11" font-weight="600" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">ZERO</text><text x="820.0" y="58" font-size="11" font-weight="600" text-anchor="middle" fill="#12202E" font-family="'IBM Plex Mono', ui-monospace, monospace" letter-spacing="0.08em" dominant-baseline="middle">RATE BEFORE</text><text x="360.0" y="92.0" font-size="11.5" font-weight="600" text-anchor="end" fill="#12202E" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">Sysmon-11[Image,TargetFilename]</text><text x="360.0" y="109.0" font-size="11" font-weight="400" text-anchor="end" fill="#4A5C72" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">file create  ·  1,240 events before</text><line x1="380.0" y1="100.0" x2="820.0" y2="100.0" stroke="#CBD6E1" stroke-width="1"/><rect x="701.2" y="85.0" width="118.8" height="30" rx="3" fill="#DEE6EF"/><circle cx="820.0" cy="100.0" r="6" fill="none" stroke="#12202E" stroke-width="1.8"/><circle cx="767.2" cy="100.0" r="7" fill="#2A6A50"/><text x="852.0" y="92.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#2A6A50" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">no finding</text><text x="852.0" y="109.0" font-size="11" font-weight="400" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">drop is inside the noise band</text><text x="360.0" y="180.0" font-size="11.5" font-weight="600" text-anchor="end" fill="#12202E" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">Sysmon-10[GrantedAccess,SourceImage,TargetImage]</text><text x="360.0" y="197.0" font-size="11" font-weight="400" text-anchor="end" fill="#4A5C72" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">lsass handle open  ·  318 events before</text><line x1="380.0" y1="188.0" x2="820.0" y2="188.0" stroke="#CBD6E1" stroke-width="1"/><rect x="727.6" y="173.0" width="92.4" height="30" rx="3" fill="#DEE6EF"/><circle cx="820.0" cy="188.0" r="6" fill="none" stroke="#12202E" stroke-width="1.8"/><circle cx="380.0" cy="188.0" r="7" fill="#A03A28"/><text x="852.0" y="180.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#A03A28" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">LOST</text><text x="852.0" y="197.0" font-size="11" font-weight="400" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">zero events after the change</text><text x="360.0" y="268.0" font-size="11.5" font-weight="600" text-anchor="end" fill="#12202E" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">PowerShell-4104[Path,ScriptBlockText]</text><text x="360.0" y="285.0" font-size="11" font-weight="400" text-anchor="end" fill="#4A5C72" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">script block  ·  12 events before</text><line x1="380.0" y1="276.0" x2="820.0" y2="276.0" stroke="#CBD6E1" stroke-width="1" stroke-dasharray="4 4"/><circle cx="820.0" cy="276.0" r="6" fill="none" stroke="#12202E" stroke-width="1.8"/><circle cx="564.8" cy="276.0" r="7" fill="#4A5C72"/><text x="852.0" y="268.0" font-size="12.5" font-weight="700" text-anchor="start" fill="#9C6A05" font-family="'IBM Plex Mono', ui-monospace, monospace" dominant-baseline="middle">INCONCLUSIVE</text><text x="852.0" y="285.0" font-size="11" font-weight="400" text-anchor="start" fill="#4A5C72" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">12 is below the minimum of 30</text><line x1="820.0" y1="70" x2="820.0" y2="316" stroke="#12202E" stroke-width="1.4" stroke-dasharray="4 4"/><path d="M820.0 336 H384.0" fill="none" stroke="#5A6E86" stroke-width="1.6" marker-end="url(#ar)"/><text x="600" y="356" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4A5C72" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">shaded band = 3 × the run-to-run variation measured from the 5 control runs, where nothing was changed</text><text x="600" y="374" font-size="11.5" font-weight="400" text-anchor="middle" fill="#4A5C72" font-family="'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif" dominant-baseline="middle">a drop is reported only when all three hold:  q ≤ 0.05,   ratio ≤ 0.5,   and the drop exceeds the band</text></svg>
